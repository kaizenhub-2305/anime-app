<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaizenime - Live API Streaming</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0c10; color: #fff; overflow-x: hidden; }
        
        header { padding: 15px 20px; background: rgba(11, 12, 16, 0.95); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); border-bottom: 1px solid #1f2833; display: flex; flex-direction: column; gap: 12px; }
        .logo-area { display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 22px; color: #66fcf1; font-weight: 800; letter-spacing: 1px; text-shadow: 0 0 10px rgba(102,252,241,0.4); }
        .badge-hd { background: #45a29e; color: #0b0c10; padding: 3px 8px; font-size: 10px; font-weight: bold; border-radius: 4px; }
        .search-box { width: 100%; padding: 12px 18px; border-radius: 20px; border: 1px solid #1f2833; background: #1f2833; color: #fff; font-size: 14px; outline: none; transition: 0.3s; }
        .search-box:focus { border-color: #66fcf1; box-shadow: 0 0 8px rgba(102,252,241,0.3); }

        .hero-3d { height: 140px; margin: 15px; border-radius: 16px; background: linear-gradient(135deg, #1f2833, #0b0c10); border: 1px solid #45a29e; display: flex; align-items: center; justify-content: center; text-align: center; padding: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.6); }
        .hero-3d h2 { font-size: 16px; color: #66fcf1; margin-bottom: 4px; }
        .hero-3d p { font-size: 11px; color: #c5c6c7; }

        .container { padding: 0 15px 20px 15px; }
        .section-title { font-size: 16px; margin-bottom: 12px; color: #c5c6c7; font-weight: bold; border-left: 3px solid #66fcf1; padding-left: 8px; display: flex; justify-content: space-between; align-items: center; }
        .total-count { font-size: 12px; color: #45a29e; font-weight: normal; }
        
        .anime-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .anime-card { background: #1f2833; border-radius: 10px; overflow: hidden; border: 1px solid #2c3542; cursor: pointer; display: flex; flex-direction: column; transition: transform 0.2s; }
        .anime-card:active { transform: scale(0.96); }
        .poster-wrapper { width: 100%; height: 210px; position: relative; background: #000; }
        .anime-poster { width: 100%; height: 100%; object-fit: cover; }
        .score-badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); color: #66fcf1; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .anime-info { padding: 10px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .anime-title { font-size: 13px; font-weight: bold; color: #fff; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .anime-genre { font-size: 10px; color: #c5c6c7; }

        .loading-text { text-align: center; grid-column: span 2; padding: 30px; color: #66fcf1; font-size: 14px; }

        #player-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0c10; display: none; flex-direction: column; z-index: 200; overflow-y: auto; }
        .player-header { padding: 12px 15px; display: flex; align-items: center; background: #1f2833; border-bottom: 1px solid #2c3542; }
        .back-btn { background: none; border: none; color: #66fcf1; font-size: 14px; cursor: pointer; font-weight: bold; margin-right: 15px; }
        .video-container { width: 100%; background: #000; aspect-ratio: 16/9; position: relative; }
        .video-container iframe { width: 100%; height: 100%; border: none; }
        .player-body { padding: 15px; }
        .player-title { font-size: 16px; font-weight: bold; color: #66fcf1; margin-bottom: 10px; }
        
        .section-label { font-size: 12px; color: #c5c6c7; margin: 12px 0 6px 0; font-weight: bold; }
        .resolutions { display: flex; gap: 8px; }
        .res-btn { padding: 6px 12px; background: #1f2833; border: 1px solid #45a29e; color: #fff; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .res-btn.active { background: #66fcf1; color: #0b0c10; }

        .episode-list { display: flex; gap: 6px; flex-wrap: wrap; max-height: 200px; overflow-y: auto; padding-right: 5px; }
        .ep-btn { padding: 8px 12px; background: #1f2833; border: 1px solid #2c3542; color: #fff; border-radius: 6px; font-size: 11px; cursor: pointer; min-width: 45px; text-align: center; }
        .ep-btn.active { background: #66fcf1; color: #0b0c10; border-color: #66fcf1; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>KAIZENIME</h1>
            <span class="badge-hd">LIVE API HD</span>
        </div>
        <input type="text" id="search" class="search-box" placeholder="Cari ribuan anime di dunia (cth: Naruto, Bleach)..." oninput="debounceSearch()">
    </header>

    <div class="hero-3d">
        <div>
            <h2>🌐 Terhubung ke Database Global</h2>
            <p>Cari anime apa saja secara instan dari seluruh dunia!</p>
        </div>
    </div>

    <div class="container">
        <div class="section-title">
            <span>Hasil Pencarian / Trending</span>
            <span class="total-count" id="totalCount">Memuat...</span>
        </div>
        <div class="anime-grid" id="animeGrid">
            <div class="loading-text">Menghubungkan ke Live API...</div>
        </div>
    </div>

    <div id="player-modal">
        <div class="player-header">
            <button class="back-btn" onclick="closePlayer()">← Kembali</button>
            <h3 id="modal-title" style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Judul Anime</h3>
        </div>
        <div class="video-container">
            <iframe id="animeVideo" src="" allowfullscreen></iframe>
        </div>
        <div class="player-body">
            <div class="player-title" id="playerAnimeTitle">Judul Anime</div>
            
            <div class="section-label">PILIHAN RESOLUSI HD:</div>
            <div class="resolutions">
                <button class="res-btn active" onclick="setRes('360p')">360p</button>
                <button class="res-btn" onclick="setRes('480p')">480p</button>
                <button class="res-btn" onclick="setRes('720p')">720p HD</button>
                <button class="res-btn" onclick="setRes('1080p')">1080p FHD</button>
            </div>

            <div class="section-label" id="epSectionLabel">PILIH EPISODE:</div>
            <div class="episode-list" id="episodeList"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://api.jikan.moe/v4';
        let searchTimeout = null;

        // Ambil data anime populer saat aplikasi pertama kali dibuka
        async function fetchTopAnime() {
            try {
                const res = await fetch(`${API_BASE}/top/anime?limit=20`);
                const data = await res.json();
                renderAnime(data.data);
            } catch (error) {
                document.getElementById('animeGrid').innerHTML = `<div class="loading-text">Gagal memuat data. Periksa koneksi internet!</div>`;
            }
        }

        // Fungsi pencarian dinamis ke Live API dengan Debounce
        function debounceSearch() {
            clearTimeout(searchTimeout);
            const keyword = document.getElementById('search').value.trim();
            
            if (keyword.length === 0) {
                fetchTopAnime();
                return;
            }

            document.getElementById('animeGrid').innerHTML = `<div class="loading-text">Mencari anime...</div>`;
            
            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`${API_BASE}/anime?q=${encodeURIComponent(keyword)}&limit=20`);
                    const data = await res.json();
                    if (data.data && data.data.length > 0) {
                        renderAnime(data.data);
                    } else {
                        document.getElementById('animeGrid').innerHTML = `<div class="loading-text">Anime tidak ditemukan!</div>`;
                        document.getElementById('totalCount').innerText = `0 Ditemukan`;
                    }
                } catch (error) {
                    document.getElementById('animeGrid').innerHTML = `<div class="loading-text">Terjadi kesalahan saat mencari.</div>`;
                }
            }, 500);
        }

        function renderAnime(animeList) {
            const grid = document.getElementById('animeGrid');
            document.getElementById('totalCount').innerText = `${animeList.length} Anime`;
            grid.innerHTML = "";
            
            animeList.forEach(anime => {
                const title = anime.title;
                const poster = anime.images.jpg.image_url;
                const score = anime.score || 'N/A';
                const genres = anime.genres.map(g => g.name).join(', ') || 'Action';
                const episodes = anime.episodes || 12;
                
                // Bungkus data aman ke dalam atribut onclick
                const animeDataObj = encodeURIComponent(JSON.stringify({
                    title: title,
                    episodes: episodes
                }));

                grid.innerHTML += `
                    <div class="anime-card" onclick='openPlayer(decodeURIComponent("${animeDataObj}"))'>
                        <div class="poster-wrapper">
                            <span class="score-badge">⭐ ${score}</span>
                            <img src="${poster}" class="anime-poster" alt="${title}" loading="lazy">
                        </div>
                        <div class="anime-info">
                            <div class="anime-title">${title}</div>
                            <div class="anime-genre">${genres}</div>
                        </div>
                    </div>
                `;
            });
        }

        function openPlayer(animeStr) {
            const anime = JSON.parse(animeStr);
            document.getElementById('modal-title').innerText = anime.title;
            document.getElementById('playerAnimeTitle').innerText = anime.title;
            document.getElementById('epSectionLabel').innerText = `PILIH EPISODE (Total: ${anime.episodes} Episode):`;
            document.getElementById('player-modal').style.display = 'flex';
            loadEpisode(1);
        }

        function loadEpisode(epNum) {
            document.getElementById('animeVideo').src = "https://www.youtube.com/embed/ScMzIvxBSi4";
            
            const epList = document.getElementById('episodeList');
            epList.innerHTML = "";
            
            // Batasi tombol episode maksimal 50 tombol agar UI tetap ringan & mulus dipencet
            const total = 50; 
            for (let i = 1; i <= total; i++) {
                epList.innerHTML += `<button class="ep-btn ${i === epNum ? 'active' : ''}" onclick="loadEpisode(${i})">Ep ${i}</button>`;
            }
        }

        function closePlayer() {
            document.getElementById('player-modal').style.display = 'none';
            document.getElementById('animeVideo').src = "";
        }

        function setRes(res) {
            document.querySelectorAll('.res-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // Jalankan saat pertama kali load
        fetchTopAnime();
    </script>
</body>
</html>
