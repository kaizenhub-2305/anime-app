<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENN ANIME - Sub Indo</title>
    <!-- Tailwind CSS via CDN untuk styling cepat & responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen pb-10">
    
    <!-- Header / Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <h1 class="text-lg font-bold tracking-wider text-red-500">⚡ ZENN <span class="text-white">ANIME</span></h1>
        <input type="text" id="search-input" placeholder="Cari anime..." class="bg-slate-800 text-sm px-3 py-1.5 rounded-lg border border-slate-700 focus:outline-none focus:ring-2 focus:ring-red-500 w-1/2 sm:w-1/3">
    </header>

    <main class="p-4 max-w-3xl mx-auto">
        
        <!-- Video Player Section (Hidden secara default) -->
        <div id="player-container" class="hidden mb-6 bg-slate-900 p-3 rounded-2xl border border-slate-800 shadow-xl">
            <div class="flex justify-between items-center mb-2 px-1">
                <h2 id="anime-title" class="font-bold text-sm sm:text-base text-slate-200 truncate">Judul Anime</h2>
                <button onclick="closePlayer()" class="text-xs bg-red-600 px-3 py-1 rounded-lg font-medium hover:bg-red-700 transition">Tutup ✕</button>
            </div>
            <div class="relative aspect-video bg-black rounded-xl overflow-hidden shadow-inner">
                <video id="video-player" controls crossorigin="anonymous" class="w-full h-full object-contain">
                    <source id="video-source" src="" type="video/mp4">
                    <!-- Tempat Subtitle Indo (.vtt) -->
                    <track id="sub-source" src="" kind="subtitles" srclang="id" label="Indonesia" default>
                    Browser kamu tidak mendukung video player.
                </video>
            </div>
        </div>

        <!-- Katalog Anime Grid -->
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">🔥 Daftar Anime Terbaru (Sub Indo)</h3>
        <div id="anime-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <!-- Item akan digenerate otomatis lewat JS -->
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
